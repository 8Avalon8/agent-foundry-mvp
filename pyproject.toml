[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-foundry-mvp"
version = "0.1.0"
description = "A Pre-Spec decision-board driven Agent Builder MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0"
]

[project.scripts]
agent-foundry = "agent_foundry.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_foundry*"]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
