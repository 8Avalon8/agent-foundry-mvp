agent:
  name: svn-reviewer
  version: 0.1.0
  type: review-agent
  description: SVN Review Agent generated by Agent Foundry MVP.
source:
  user_goal: 我想做一个 SVN Review Agent，帮我审查 diff
  pre_spec_session_id: session_bf87dddd95c6
  selected_preset: controlled_semi_auto
  llm_provider: mock
  llm_design:
    title: SVN Review Agent
    risk_level: medium
    summary:
    - 读取 SVN diff 并结合项目上下文生成分级 Review 报告
    - 默认不自动修改代码，也不自动 commit
    - 运行测试、写 patch、更新规则前通过审批卡暂停
    - 用户对 finding 打标签后，Agent 生成 Rule Patch 候选
    recommended_preset_id: controlled_semi_auto
    recommended_preset_reason: 代码审查需要上下文和一定自动化，但写入和命令执行要保留人工确认。
    notes:
    - Mock 设计简报；真实 LLM 会根据代码库、流程和用户偏好提出更多定制问题。
custom_decisions:
  evidence_style:
    value: line_and_reason
    source: recommended_accepted
    confidence: medium
    note: ''
    inputs: {}
goal:
  primary: 审查 SVN / diff 变更，发现潜在问题并生成可执行的 Review 报告。
  secondary:
  - 降低人工 Review 成本
  - 沉淀项目审查规则
  - 减少重复误报
  focus:
  - bug_risk
  - maintainability
  - test_impact
lifecycle:
  mode: on_demand
  trigger:
  - manual
  - diff_available
autonomy:
  level: L2
  max_iterations_without_user: 3
  default_behavior: auto_low_risk_ask_high_risk
inputs:
  required:
  - svn_diff
  optional:
  - related_source_files
  - project_rules
  - previous_feedback
tools:
  required_capabilities:
  - read_svn_diff
  - read_files
  - search_code
  - generate_markdown
  - ask_user
  - propose_rule_patch
tool_policy:
  svn.diff:
    permission: allow
    risk: low
  fs.read:
    permission: allow
    scope: current_project
    risk: low_to_medium
  code.search:
    permission: allow
    scope: current_project
    risk: low_to_medium
  shell.run_tests:
    permission: ask
    allowed_commands: []
    risk: medium
  fs.write_patch:
    permission: deny
    risk: medium_high
  fs.modify_source:
    permission: ask
    risk: high
  svn.commit:
    permission: deny
    risk: critical
human_feedback:
  finding_feedback:
    mode: inline_labels
    options:
    - accepted
    - false_positive
    - too_minor
    - duplicate
    - needs_more_evidence
  before_run_tests:
    mode: approval
    show_command: true
    when: tool_policy.shell.run_tests.permission == ask
  before_sensitive_action:
    mode: risk_card_with_reason
  rule_update:
    mode: diff_review
    requires_approval: true
memory:
  short_term:
  - current_diff
  - current_review_context
  - current_user_feedback
  long_term_candidates:
  - accepted_patterns
  - false_positive_patterns
  - project_rules
  update_policy: approved_rule_patch
  update_requires_approval: true
  forbidden:
  - credentials
  - secrets
  - unrelated_private_content
output:
  format: markdown_report
  artifacts:
  - review_report.md
  - findings.json
  - test_suggestions.md
  - rule_patch_proposal.md
eval:
  metrics:
  - finding_acceptance_rate
  - false_positive_rate
  - actionable_suggestion_rate
  - user_revision_count
