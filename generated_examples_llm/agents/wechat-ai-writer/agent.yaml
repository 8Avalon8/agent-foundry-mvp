agent:
  name: wechat-ai-writer
  version: 0.1.0
  type: writing-agent
  description: AI 公众号写作助手 generated by Agent Foundry MVP.
source:
  user_goal: 我想做一个帮助我持续写微信公众号，分享 AI 技巧和使用心得的 Agent
  pre_spec_session_id: session_d8ae8b7ca453
  selected_preset: continuous_writer
  llm_provider: mock
  llm_design:
    title: AI 公众号写作助手
    risk_level: medium
    summary:
    - 把碎片素材整理为选题池
    - 先生成 3-5 个方向供用户选择，再生成大纲和初稿
    - 发布动作必须显式确认
    - 写作风格通过 Style Patch 审批后沉淀
    recommended_preset_id: continuous_writer
    recommended_preset_reason: 用户想持续输出内容，低打扰半自动比纯手动更合适。
    notes:
    - Mock 设计简报；真实 LLM 会根据用户上下文生成更贴合的动态问题。
custom_decisions:
  tone_guardrail:
    value:
    - empty_grandstanding
    - marketing_tone
    source: recommended_accepted
    confidence: medium
    note: ''
    inputs: {}
goal:
  primary: 帮助用户持续产出关于 AI 技巧、实践心得和工程化思考的公众号文章。
  secondary:
  - 降低选题成本
  - 沉淀写作风格
  - 减少重复修改
  - 生成完整发布包
  focus:
  - engineering_thinking
  - ai_usage
  - personal_practice
lifecycle:
  mode: continuous
  trigger:
  - manual
  - weekly_suggestion
autonomy:
  level: L2
  max_iterations_without_user: 3
  default_behavior: draft_then_ask_at_key_checkpoints
inputs:
  required:
  - material_or_topic
  optional:
  - notes
  - style_rules
  - previous_articles
tools:
  required_capabilities:
  - read_user_notes
  - generate_markdown
  - ask_user
  - store_style_memory
  - export_publish_package
tool_policy:
  fs.read_notes:
    permission: allow
    scope: configured_notes_path
    risk: medium
  fs.write_draft:
    permission: allow
    risk: low
  wechat.create_draft:
    permission: ask
    risk: high
  wechat.publish:
    permission: ask
    risk: critical
human_feedback:
  topic_selection:
    mode: choice
    options_count: 3-5
  outline_review:
    mode: structured_comment
  draft_review:
    mode: report_plus_chat
  before_publish:
    mode: explicit_approval
    required_phrase: 确认发布
  style_rule_update:
    mode: diff_review
    requires_approval: true
memory:
  short_term:
  - current_article_goal
  - current_feedback
  long_term_candidates:
  - tone
  - title_preference
  - article_structure
  update_policy: approved_style_patch
  update_requires_approval: true
  forbidden:
  - credentials
  - private_unrelated_content
output:
  format: publish_package
  artifacts:
  - article.md
  - title_options.md
  - summary.md
  - cover_prompt.md
  - publish_checklist.md
eval:
  metrics:
  - user_edit_distance
  - approval_rate
  - revision_rounds
  - style_match_score
